[tool.ruff]
line-length = 100
target-version = "py312"
# Generated code is not held to import-order rules.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Defaults (pyflakes/pycodestyle) plus import sorting.
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "common", "config", "live", "quizbar", "rooms"]
