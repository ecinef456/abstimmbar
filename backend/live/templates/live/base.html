{# Ultra-light participant shell (ADR-0001): no framework, one inline stylesheet. #}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
<script>
(function(){try{
  var p=new URLSearchParams(location.search).get("theme");
  var t=p||localStorage.getItem("abstimmbar_theme");
  var dark=t==="dark"||((t==="auto"||!t)&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  if(dark)document.documentElement.setAttribute("data-theme","dark");
}catch(e){}})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}Abstimmbar{% endblock %}</title>
<style>
  :root {
    --ink: #26292b; --ink-soft: #6b7176; --line: #e4e7e9;
    /* Text-field boundary: 3:1 against the page (WCAG 1.4.11, #178);
       --line stays the soft divider/card border. */
    --field-line: #858c92;
    --brand: #8fd6a2; --brand-strong: #2c7a45; --brand-soft: #eefaf1;
    --bg: #fff; --surface: #fff;
    --danger-soft: #fdeeee; --danger: #c4453e; --danger-strong: #a33630;
    --cat-0: oklch(0.80 0.095 250); --cat-1: oklch(0.80 0.095 60); --cat-2: oklch(0.80 0.095 305);
    --cat-3: oklch(0.80 0.095 220); --cat-4: oklch(0.80 0.095 85); --cat-5: oklch(0.80 0.095 335);
    --correct: oklch(0.70 0.14 150); --correct-strong: oklch(0.55 0.14 150);
    --on-correct-strong: #fff;
    --wrong: oklch(0.88 0.045 20);
    --bar-ink: oklch(0.28 0.02 220);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --ink: #e5e9ec; --ink-soft: #9aa2a8; --line: #2a3138; --bg: #0c1013; --surface: #161c22;
    --field-line: #636b72;
    /* Lighter so the ✓ text reaches 4.5:1 on the dark page (#178); text on
       a --correct-strong fill switches to dark ink accordingly. */
    --correct-strong: oklch(0.64 0.14 150); --on-correct-strong: #0c1013;
    --brand: #8fd6a2; --brand-strong: #9be0b1; --brand-soft: #17291e;
    --danger-soft: #3a1e1c; --danger: #d98a84; --danger-strong: #e8a39d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  /* Phone layout (#179): never scroll sideways — a stray wide element would
     otherwise push the fixed ⋮/language menu off-screen. */
  html { overflow-x: clip; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg); min-height: 100svh;
    display: flex; flex-direction: column;
  }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line);
           font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  header .bar { color: var(--brand-strong); }
  main { flex: 1; width: 100%; max-width: 480px; margin: 0 auto;
         padding: 22px 18px 40px;
         /* Long unbreakable words (German compounds, URLs) in options,
            answers and results wrap instead of overflowing (#179). Unlike
            break-word, "anywhere" also shrinks min-content, so it works in
            flex items and inline-block chips. */
         overflow-wrap: anywhere; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .soft { color: var(--ink-soft); font-size: 14px; }
  .center { text-align: center; padding-top: 8vh; }
  .emoji { width: 64px; height: 64px; border-radius: 18px; background: var(--brand-soft);
           display: flex; align-items: center; justify-content: center;
           font-size: 30px; margin: 0 auto 14px; }
  /* Inline Lucide icons (same set as the SPA; the participant page is
     framework-free, so they're inlined SVG rather than lucide-react). */
  .ic { display: inline-block; vertical-align: middle; }
  .emoji .ic { width: 32px; height: 32px; color: var(--brand-strong); }
  button, .btn {
    font: inherit; width: 100%; padding: 14px 16px; margin-top: 10px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
    color: var(--ink); font-weight: 600; text-align: left; cursor: pointer;
    min-height: 52px;
  }
  button:focus-visible { outline: 2px solid var(--brand-strong); outline-offset: 2px; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #1f2933; text-align: center; }
  button:disabled { opacity: .5; }
  button.selected { background: var(--brand-soft); border-color: var(--brand-strong); }
  /* Self-paced feedback: keep the colors readable on frozen buttons. */
  button.correct { background: var(--brand-soft); border-color: var(--brand-strong);
                   color: var(--brand-strong); }
  button.wrong { background: var(--danger-soft); border-color: var(--danger); color: var(--danger-strong); }
  button:disabled.correct, button:disabled.wrong { opacity: 1; }
  input[type=text] {
    font: inherit; width: 100%; padding: 14px 16px; margin-top: 10px;
    border: 1px solid var(--field-line); border-radius: 14px; min-height: 52px;
    background: var(--surface); color: var(--ink);
  }
  input[type=text]:focus-visible { outline: 2px solid var(--brand-strong); }
  /* Same surface as text inputs (dark mode would otherwise use the UA grey). */
  textarea { background: var(--surface); color: var(--ink); border: 1px solid var(--field-line); }
  .question-text { margin: 10px 0 6px; font-size: 18px; line-height: 1.45; }
  .question-text img { max-width: 100%; border-radius: 10px; }
  .question-text ul, .question-text ol { padding-left: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>abstimm<span class="bar">BAR</span></header>
<main>{% block content %}{% endblock %}</main>
{% block script %}{% endblock %}
</body>
</html>
