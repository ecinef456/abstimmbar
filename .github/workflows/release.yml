name: Release image

# Publishes a single all-in-one image (frontend baked in, see ../../Dockerfile)
# to GHCR whenever a version tag is pushed. Separate from .gitlab-ci.yml,
# which keeps running lint/test on the self-hosted Uni Osnabrück GitLab.
#
# Major bumps (v1.x.x -> v2.0.0, etc.) run the build-and-push job under the
# "major-release" GitHub Environment, which must be configured with a
# required reviewer in repo Settings -> Environments — the job pauses there
# until a human approves, since a major tag can mean a breaking change going
# out under :latest. Minor/patch tags run under "auto-release" (no
# protection rules) and proceed immediately. The very first tag has no
# predecessor to compare against and is treated as a minor/patch release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  classify:
    name: Classify bump vs. previous tag
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.classify.outputs.major }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full tag history to find the previous tag

      - name: Classify bump
        id: classify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Strip leading "v" and any prerelease/build suffix for the comparison.
          ver="${TAG#v}"
          cur_core="${ver%%-*}"
          cur_major="${cur_core%%.*}"

          # Previous tag reachable from this one (excludes the current tag).
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"

          if [ -z "$prev" ]; then
            echo "No previous tag found — treating $TAG as a minor/patch release."
            echo "major=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prev_core="${prev#v}"; prev_core="${prev_core%%-*}"
          prev_major="${prev_core%%.*}"

          echo "Current: $TAG (major $cur_major) — previous: $prev (major $prev_major)"
          if [ "$cur_major" != "$prev_major" ]; then
            echo "Major bump detected — build-and-push will require approval."
            echo "major=true" >> "$GITHUB_OUTPUT"
          else
            echo "major=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: classify
    runs-on: ubuntu-latest
    environment: ${{ needs.classify.outputs.major == 'true' && 'major-release' || 'auto-release' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/virtuos/abstimmbar
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
